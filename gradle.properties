kotlin.code.style=official

# ---------------------------------------------------------------------------------
# JDK con el que se compila y se ejecuta el proyecto.
#
# 21 es el mínimo de este repositorio y el LTS más extendido. Si tienes otro JDK
# instalado (por ejemplo 25), cambia este número: no hace falta tocar build.gradle.kts.
#
# Si Gradle no encuentra localmente el JDK que pidas, intentará descargarlo mediante
# el plugin foojay-resolver declarado en settings.gradle.kts, lo que requiere red.
# ---------------------------------------------------------------------------------
kotlinReference.jdk=21

# UTF-8 en el demonio de Gradle: los ficheros fuente llevan acentos y eñes.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# La caché de configuración NO es compatible con `standardInput = System.in`, que es
# lo que hace funcionar el menú interactivo del lanzador. Se deja desactivada a
# propósito.
org.gradle.configuration-cache=false
